[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra-turntable"
version = "1.0.0"
description = "Two words, one solid: a shadow sculpture that turns in your terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
]

[project.scripts]
umbra = "umbra.cli:main"

[tool.setuptools]
packages = ["umbra"]
