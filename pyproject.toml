[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landloom"
version = "0.1.0"
description = "Weave a complete fantasy region — map, rivers, towns, names, and a printable atlas — from a single seed phrase. Offline, deterministic, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Landloom" }]
keywords = ["map", "fantasy", "procedural", "ttrpg", "pdf", "worldbuilding", "generator"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
landloom = "landloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
